<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRAFT Prompt Builder</title>
<meta name="description" content="Generate a CRAFT prompt for a one-page ministry AI strategy blueprint and 100-day acceleration roadmap, in English or Bahasa Melayu.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%2313294B'/><text x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='40' font-weight='600' fill='%23D9B868'>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
<style>
  :root {
    --band: #102443;
    --band-ink: #FFFFFF;
    --band-muted: #BAC5D7;
    --band-line: #33496E;
    --paper: #EDF0F4;
    --surface: #FFFFFF;
    --ink: #172033;
    --muted: #556074;
    --line: #D5DBE4;
    --navy: #13294B;
    --navy-hover: #1F3D6B;
    --on-navy: #FFFFFF;
    --badge: #13294B;
    --gold: #D9B868;
    --gold-ink: #8A6A22;
    --gold-soft: #F4ECD9;
    --focus: #2F6FD0;
    --shadow: 0 1px 2px rgba(16, 36, 67, 0.06), 0 8px 24px rgba(16, 36, 67, 0.06);
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    --sans: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --band: #0A1628; --band-muted: #9FAEC6; --band-line: #253858;
      --paper: #0F1827; --surface: #162134; --ink: #E7ECF3; --muted: #9CA8BB; --line: #2A3850;
      --navy: #B7CBEE; --navy-hover: #CFDDF5; --on-navy: #0F1827; --badge: #22365A;
      --gold: #D9B868; --gold-ink: #D9BD80; --gold-soft: #3A3122; --focus: #7FB0F5;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    --band: #0A1628; --band-muted: #9FAEC6; --band-line: #253858;
    --paper: #0F1827; --surface: #162134; --ink: #E7ECF3; --muted: #9CA8BB; --line: #2A3850;
    --navy: #B7CBEE; --navy-hover: #CFDDF5; --on-navy: #0F1827; --badge: #22365A;
    --gold: #D9B868; --gold-ink: #D9BD80; --gold-soft: #3A3122; --focus: #7FB0F5;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 640px) { .wrap { padding: 0 16px; } }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- Masthead: navy cover band ---------- */
  .masthead { background: var(--band); color: var(--band-ink); padding-top: env(safe-area-inset-top, 0px); }
  .bar {
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
    padding-top: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--band-line);
  }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--band-muted); }
  .eyebrow .mono-mark {
    width: 30px; height: 30px; border: 1.5px solid var(--gold); border-radius: 6px; display: grid; place-items: center;
    font-family: var(--serif); font-size: 1.1rem; font-weight: 600; color: var(--gold); letter-spacing: 0;
  }
  .lang { display: flex; align-items: center; gap: 10px; }
  .lang-label { font-size: 0.82rem; color: var(--band-muted); }
  .seg { display: inline-flex; border: 1px solid var(--band-muted); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 0.88rem; color: var(--band-ink); }
  .seg button + button { border-left: 1px solid var(--band-muted); }
  .seg button:hover { background: rgba(255, 255, 255, 0.08); }
  .seg button[aria-pressed="true"] { background: var(--band-ink); color: #102443; }

  .hero { padding-top: 30px; padding-bottom: 4px; display: grid; gap: 16px; }
  h1 {
    margin: 0; font-family: var(--serif); font-weight: 600; font-size: clamp(1.85rem, 3.4vw, 2.75rem);
    line-height: 1.12; letter-spacing: -0.01em; max-width: 36ch; text-wrap: balance;
  }
  .hero p { margin: 0; color: var(--band-muted); font-size: 1.02rem; max-width: 70ch; }
  .steps { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 28px; counter-reset: step; }
  .steps li { counter-increment: step; display: flex; align-items: center; gap: 10px; font-size: 0.92rem; color: var(--band-ink); }
  .steps li::before {
    content: counter(step); flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--gold);
    color: var(--gold); display: grid; place-items: center; font-size: 0.78rem; font-weight: 600;
  }

  /* CRAFT tabs: binder dividers that sit on the band and open onto the page */
  .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding-top: 28px; }
  .tab {
    display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink);
    background: var(--paper); border-radius: 10px 10px 0 0; padding: 14px 18px 14px; position: relative;
  }
  .tab::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 3px; background: var(--gold); border-radius: 0 0 2px 2px; transform: scaleX(0); transform-origin: left; transition: transform .2s; }
  .tab:hover::before { transform: scaleX(1); }
  @media (prefers-reduced-motion: reduce) { .tab::before { transition: none; } }
  .tab .L { font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 4vw, 2.9rem); line-height: 1; color: var(--navy); }
  .tab .en { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 6px; }
  .tab .ms { font-family: var(--serif); font-style: italic; font-size: 0.95rem; color: var(--gold-ink); line-height: 1.25; }
  .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); opacity: 0.55; }
  .dot.on { background: var(--navy); border-color: var(--navy); opacity: 1; }
  .dots.none { font-size: 0.75rem; color: var(--muted); }
  @media (max-width: 640px) {
    .tabs { gap: 4px; padding-top: 24px; }
    .tab { padding: 10px 8px 10px; border-radius: 8px 8px 0 0; }
    .tab::before { left: 8px; right: 8px; }
    .tab .en { font-size: 0.66rem; letter-spacing: 0.04em; }
    .tab .ms { font-size: 0.78rem; }
    .dot { width: 5px; height: 5px; border-width: 1px; }
    .dots { gap: 3px; }
  }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding-top: 16px; padding-bottom: 40px; }
  @media (min-width: 1040px) { .layout { grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 40px; } }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 0 18px; }
  .btn {
    border: 1px solid var(--navy); background: var(--surface); color: var(--navy); padding: 9px 16px;
    border-radius: 6px; font-weight: 600; font-size: 0.92rem; cursor: pointer; line-height: 1.3;
  }
  .btn:hover { background: var(--gold-soft); }
  .btn.primary { background: var(--navy); color: var(--on-navy); }
  .btn.primary:hover { background: var(--navy-hover); border-color: var(--navy-hover); }
  .btn.quiet { border-color: var(--line); color: var(--muted); background: transparent; }
  .btn.quiet:hover { border-color: var(--muted); color: var(--ink); background: transparent; }
  .progress { margin-left: auto; font-size: 0.88rem; color: var(--muted); }

  /* ---------- Section cards ---------- */
  section.block {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
    padding: 28px 32px 12px; margin-bottom: 20px; scroll-margin-top: 16px;
  }
  @media (max-width: 640px) { section.block { padding: 22px 18px 8px; } }
  .block-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .mark {
    flex: none; width: 56px; height: 56px; border-radius: 8px; background: var(--badge); color: var(--gold);
    display: grid; place-items: center; font-family: var(--serif); font-weight: 600; font-size: 2.1rem; line-height: 1;
  }
  .block-head h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.5rem; line-height: 1.2; }
  .block-head .ms { font-family: var(--serif); font-style: italic; font-size: 1.05rem; color: var(--gold-ink); line-height: 1.3; }
  .block-head p { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; }

  .field { margin-bottom: 22px; }
  .field-top { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 2px; }
  .field label { font-weight: 600; font-size: 0.98rem; }
  .opt { font-weight: 400; color: var(--muted); font-size: 0.82rem; margin-left: 8px; }
  .ex-btn {
    border: 0; background: none; color: var(--gold-ink); font-weight: 600; font-size: 0.82rem; cursor: pointer;
    padding: 2px 0; white-space: nowrap; border-bottom: 1px dotted currentColor;
  }
  .ex-btn:hover { color: var(--ink); border-bottom-style: solid; }
  .help { margin: 0 0 8px; color: var(--muted); font-size: 0.88rem; }
  input[type="text"], textarea, select {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; line-height: 1.45; transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:hover, textarea:hover, select:hover { border-color: var(--muted); }
  input[type="text"]:focus, textarea:focus, select:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
  textarea { resize: vertical; min-height: 64px; }
  select {
    appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.7; }
  .check { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; background: var(--paper); border-radius: 8px; }
  .check input { flex: none; width: 18px; height: 18px; margin-top: 3px; accent-color: var(--navy); }
  .check .help { margin: 2px 0 0; }
  input:disabled, textarea:disabled, .ex-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ---------- Prompt document ---------- */
  @media (min-width: 1040px) { .doc { position: sticky; top: 16px; align-self: start; } }
  .doc { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--badge); border-radius: 10px; box-shadow: var(--shadow); scroll-margin-top: 16px; }
  .doc-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 14px; }
  .doc-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .doc-head h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.35rem; }
  .stats { margin: 0; font-size: 0.82rem; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #output {
    margin: 0; padding: 18px 24px 24px; font-family: var(--mono); font-size: 0.82rem; line-height: 1.65;
    white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; max-height: 72vh;
  }
  @media (min-width: 1040px) { #output { max-height: calc(100vh - 190px); } }
  #output .hd { font-weight: 600; color: var(--navy); }
  #output .ph { background: var(--gold-soft); color: var(--gold-ink); border-radius: 3px; padding: 0 2px; }
  .legend { margin: 0; padding: 12px 24px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .legend .ph-sample { background: var(--gold-soft); color: var(--gold-ink); border-radius: 3px; padding: 0 4px; font-family: var(--mono); font-size: 0.78rem; }

  .foot { padding-bottom: 36px; color: var(--muted); font-size: 0.86rem; }
  .foot p { max-width: 90ch; margin: 0; border-top: 1px solid var(--line); padding-top: 18px; }

  .jump {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--navy); color: var(--on-navy); text-decoration: none; font-weight: 600; font-size: 0.92rem;
    padding: 11px 18px; border-radius: 999px; box-shadow: 0 6px 18px rgba(16, 36, 67, 0.3);
  }
  @media (min-width: 1040px) { .jump { display: none; } }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    background: var(--band); color: #FFFFFF; padding: 10px 18px; border-radius: 6px; font-weight: 600; font-size: 0.92rem;
    border-left: 3px solid var(--gold); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  /* Print just the prompt */
  @media print {
    .masthead, form, .foot, .jump, .toast, .actions, .legend { display: none !important; }
    body { background: #fff; }
    .layout { display: block; padding: 0; }
    .doc { border: 0; box-shadow: none; position: static; }
    #output { max-height: none; overflow: visible; color: #000; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap bar">
    <div class="eyebrow"><span class="mono-mark" aria-hidden="true">C</span><span id="t-eyebrow"></span></div>
    <div class="lang" role="group" aria-labelledby="t-langLabel">
      <span id="t-langLabel" class="lang-label"></span>
      <div class="seg">
        <button type="button" data-lang="en" aria-pressed="true" lang="en">English</button>
        <button type="button" data-lang="ms" aria-pressed="false" lang="ms">Bahasa Melayu</button>
      </div>
    </div>
  </div>
  <div class="wrap hero">
    <h1 id="t-title"></h1>
    <p id="t-subtitle"></p>
    <ol class="steps" id="t-steps"></ol>
  </div>
  <nav class="wrap tabs" id="craft-nav" aria-label="CRAFT"></nav>
</header>

<main class="wrap layout">
  <form id="form" novalidate autocomplete="off">
    <div class="toolbar">
      <button type="button" class="btn" id="fillAll"></button>
      <button type="button" class="btn quiet" id="clearAll"></button>
      <span class="progress" id="progress" aria-live="polite"></span>
    </div>
    <div id="sections"></div>
  </form>

  <aside id="preview" class="doc" aria-labelledby="t-previewTitle">
    <div class="doc-head">
      <div class="doc-title">
        <h2 id="t-previewTitle"></h2>
        <p class="stats" id="stats"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="copyBtn"></button>
        <button type="button" class="btn" id="dlBtn"></button>
        <button type="button" class="btn quiet" id="printBtn"></button>
      </div>
    </div>
    <pre id="output" tabindex="0"></pre>
    <p class="legend"><span class="ph-sample">[ ]</span><span id="t-legend"></span></p>
  </aside>
</main>

<footer class="wrap foot"><p id="t-footer"></p></footer>
<a class="jump" href="#preview" id="t-jump"></a>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- Field configuration ---------- */
  const FIELDS = [
    { id: "ministry", s: "C", type: "text" },
    { id: "mandate", s: "C", type: "textarea", rows: 3 },
    { id: "priorities", s: "C", type: "textarea", rows: 3 },
    { id: "maturity", s: "C", type: "select", options: ["", "low", "moderate", "advanced"], example: "moderate" },
    { id: "maturityNote", s: "C", type: "text" },
    { id: "painPoints", s: "C", type: "textarea", rows: 4 },
    { id: "dataAssets", s: "C", type: "textarea", rows: 4 },
    { id: "systems", s: "C", type: "textarea", rows: 2 },
    { id: "constraints", s: "C", type: "textarea", rows: 3 },
    { id: "role", s: "R", type: "textarea", rows: 4 },
    { id: "ambition", s: "A", type: "textarea", rows: 2, optional: true },
    { id: "useCaseCount", s: "A", type: "select", options: ["range", "3", "4", "5"], example: "range" },
    { id: "candidates", s: "A", type: "textarea", rows: 3, optional: true },
    { id: "rpsa", s: "A", type: "textarea", rows: 3, optional: true },
    { id: "roadmap", s: "A", type: "checkbox" },
    { id: "roadmapStart", s: "A", type: "text", optional: true, dependsOn: "roadmap" },
    { id: "checkpoint", s: "A", type: "text", optional: true, dependsOn: "roadmap" },
    { id: "outputLang", s: "F", type: "select", options: ["en", "ms"] },
    { id: "wordLimit", s: "F", type: "text" },
    { id: "audience", s: "T", type: "textarea", rows: 4 }
  ];
  const SECTIONS = ["C", "R", "A", "F", "T"];
  const TEXT_FIELDS = FIELDS.filter(f => f.type === "text" || f.type === "textarea");

  /* ---------- Defaults used when a field is left empty ---------- */
  const DEFAULTS = {
    en: {
      role: "Act as a senior public sector AI strategy adviser with expertise in Malaysian government digital transformation, data governance and responsible AI. You are pragmatic, evidence-driven and focused on public value, accountability and value for money.",
      audience: "Top management of the ministry (Secretary-General, Deputy Secretaries-General, Directors and the Chief Digital Officer) who make decisions but are not technical specialists. Use clear, concise and formal language, explain technical terms briefly, and emphasise public value, accountability and return on investment.",
      words: "400–500"
    },
    ms: {
      role: "Bertindak sebagai penasihat kanan strategi AI sektor awam yang berkepakaran dalam transformasi digital kerajaan Malaysia, tadbir urus data dan AI bertanggungjawab. Anda bersikap pragmatik, berasaskan bukti dan memberikan tumpuan kepada nilai awam, akauntabiliti serta nilai faedah bagi wang yang dibelanjakan.",
      audience: "Pengurusan tertinggi kementerian (Ketua Setiausaha, Timbalan Ketua Setiausaha, Pengarah dan Ketua Pegawai Digital) yang membuat keputusan tetapi bukan pakar teknikal. Gunakan bahasa yang jelas, ringkas dan rasmi, terangkan istilah teknikal secara ringkas, dan tekankan nilai awam, akauntabiliti serta pulangan pelaburan.",
      words: "400–500"
    }
  };

  /* ---------- Placeholders kept in the prompt when a field is empty ---------- */
  const PH = {
    en: {
      ministry: "[NAME OF MINISTRY/AGENCY]",
      mandate: "[brief description of the ministry's mandate and main services]",
      priorities: "[e.g., ministry strategic plan, relevant national policies]",
      maturity: "[Low / Moderate / Advanced — brief description]",
      painPoints: "[e.g., long processing times, backlogs, manual verification]",
      dataAssets: "[list main datasets, their owners and current condition]",
      systems: "[e.g., core systems, cloud usage]",
      constraints: "[budget, manpower, skills, procurement, security classification]"
    },
    ms: {
      ministry: "[NAMA KEMENTERIAN/AGENSI]",
      mandate: "[penerangan ringkas tentang mandat dan perkhidmatan utama kementerian]",
      priorities: "[contohnya, pelan strategik kementerian, dasar nasional yang berkaitan]",
      maturity: "[Rendah / Sederhana / Tinggi — penerangan ringkas]",
      painPoints: "[contohnya, tempoh pemprosesan yang panjang, tunggakan kerja, pengesahan secara manual]",
      dataAssets: "[senaraikan set data utama, pemiliknya dan keadaan semasa]",
      systems: "[contohnya, sistem teras, penggunaan awan]",
      constraints: "[bajet, tenaga kerja, kemahiran, perolehan, klasifikasi keselamatan]"
    }
  };

  /* ---------- Interface text ---------- */
  const T = {
    en: {
      docTitle: "CRAFT Prompt Builder",
      eyebrow: "CRAFT Prompt Builder · Ministry leadership",
      title: "One-page AI strategy blueprint and 100-day acceleration roadmap",
      subtitle: "Enter your ministry's details to generate a structured prompt for an AI assistant. Any field you leave empty stays as a [placeholder] for you to complete later.",
      steps: ["Complete the five CRAFT sections", "Review the prompt draft", "Copy it into your approved AI assistant"],
      langLabel: "Language",
      fillAll: "Load illustrative example",
      clearAll: "Clear all fields",
      confirmClear: "Clear all fields? This cannot be undone.",
      cleared: "All fields cleared",
      filled: "Illustrative example loaded",
      useExample: "Use example",
      egPrefix: "e.g. ",
      optional: "optional",
      previewTitle: "Prompt draft",
      copy: "Copy prompt",
      copied: "Prompt copied",
      copyFail: "Copy failed. Select the prompt text and copy it manually.",
      download: "Download .md",
      downloaded: "Prompt downloaded",

  const STORE_KEY = "craft-blueprint-builder-v2";

  // Formats a value that follows "Label:". Multi-line values become an indented list.
  function after(text, indent) {
    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean)
      .map(s => s.replace(/^[-•*]\s*/, ""));
    if (lines.length <= 1) return " " + (lines[0] || "");
    return "\n" + lines.map(s => indent + "- " + s).join("\n");
  }

    out.push("## R — ROLE", role, "");

    out.push("5. Auditable Indicators (Impact): For each use case, propose indicators covering hours saved, turnaround speed, accuracy benchmarks and public trust scores, each with a baseline, target and data source, " +
      (rpsa ? `mapped to the following RPSA 2026–2030 targets:${after(rpsa, "     ")}` : "mapped to the relevant RPSA 2026–2030 targets [insert specific targets if known]."));

      out.push("   - Fasa 2: Membina (Hari 31–60): Mendaftarkan pasukan dengan platform AIaaS JDN; melaksanakan projek rintis dalam kotak pasir (sandbox) JDN yang selamat; memeterai perjanjian perkongsian data di bawah Akta 864.");
      out.push("   - Fasa 3: Membuktikan (Hari 61–100): Mengukur penjimatan masa dan kos berbanding dengan nilai asas; membentangkan data dalam mesyuarat pengurusan; membuat keputusan muktamad sama ada untuk memperluas, mengubah hala tuju atau menghentikan projek.");
      out.push("   Bagi setiap tonggak pencapaian, nyatakan pegawai yang bertanggungjawab, hasil utama dan bukti yang menunjukkan tonggak tersebut telah disempurnakan" + (start ? ", berserta tarikh kalendar bagi setiap fasa" : "") + ". Syorkan kes penggunaan yang wajar dijadikan projek rintis langsung yang pertama dan terangkan sebabnya. Nilai asas bagi petunjuk dalam Bahagian 5 hendaklah diukur sebelum atau semasa Fasa 2 supaya penjimatan dapat dibuktikan dalam Fasa 3. Nyatakan kriteria bagi keputusan untuk memperluas, mengubah hala tuju atau menghentikan projek.");
      out.push(`   Sasaran akhir: Membawa satu projek rintis langsung dan metrik nilai asas yang telah diukur ke titik semakan kohort yang berikutnya${cp ? ` (${cp})` : ""}.`);
    }
    out.push("", "Peraturan:");
    out.push("- Jangan mereka-reka statistik, peruntukan undang-undang atau sasaran dasar. Jika maklumat tidak mencukupi, tandakan sebagai [AKAN DISAHKAN] dan nyatakan andaian anda.");
    out.push("- Jika konteks di atas tidak mencukupi, kemukakan maksimum 5 soalan penjelasan sebelum menyediakan draf.");
    out.push("- Utamakan kes penggunaan yang mempunyai nilai awam dan tahap kesediaan data yang tinggi berbanding dengan kes yang bercita-cita tinggi dari segi teknikal.", "");
    out.push("## F — FORMAT");
    out.push(`- Tajuk: "Pelan Tindakan Eksekutif: Strategi AI ${ministry} dalam Satu Halaman"`);
    out.push("- Lima bahagian bernombor menggunakan tajuk dalam item Tindakan 1 hingga 5");
    out.push("- Gunakan jadual bagi Bahagian 2 dan Bahagian 5");
    out.push(`- Hadkan teks utama kepada kira-kira satu halaman (${words} patah perkataan, tidak termasuk jadual)`);
    if (state.roadmap) out.push(`- Akhiri dengan "Pelan Hala Tuju Pecutan 100 Hari" dalam bentuk jadual dengan lajur Fasa, Tempoh (Hari), Tonggak Pencapaian, Pegawai Bertanggungjawab dan Hasil/Bukti, diikuti dengan satu ayat yang menyatakan perkara yang akan dibawa ke titik semakan kohort yang berikutnya`);
    out.push(`- Bahasa output: ${lang}`, "");
    out.push("## T — TARGET AUDIENCE (Khalayak Sasaran)", audience);
    return out.join("\n");
  }

  const buildPrompt = () => (state.lang === "ms" ? buildMS() : buildEN());

  /* ---------- Rendering ---------- */
  function renderStatic() {
    const t = T[state.lang];
    document.documentElement.lang = state.lang === "ms" ? "ms" : "en";
    document.title = t.docTitle;
    $("t-eyebrow").textContent = t.eyebrow;
    $("t-title").textContent = t.title;
    $("t-subtitle").textContent = t.subtitle;
    $("t-langLabel").textContent = t.langLabel;
    $("fillAll").textContent = t.fillAll;
    $("clearAll").textContent = t.clearAll;
    $("t-previewTitle").textContent = t.previewTitle;
    $("copyBtn").textContent = t.copy;
    $("dlBtn").textContent = t.download;
    $("printBtn").textContent = t.print;
    $("t-legend").textContent = t.legend;
    $("t-footer").textContent = t.footer;
    $("t-jump").textContent = t.jump;
    document.querySelectorAll(".seg button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));

    const ol = $("t-steps");
    ol.replaceChildren(...t.steps.map(txt => { const li = document.createElement("li"); li.textContent = txt; return li; }));

    // CRAFT tabs: the letters and English words never change; Malay is added underneath
    const nav = $("craft-nav");
    nav.replaceChildren();
    SECTIONS.forEach(s => {
      const a = document.createElement("a");
      a.className = "tab"; a.href = "#sec-" + s;
      a.append(...sectionName(s, "span"));
      const dots = document.createElement("span"); dots.className = "dots"; dots.id = "dots-" + s;
      a.append(dots);
      nav.append(a);
    });
  }

  // Letter, English word and (in Bahasa Melayu) the Malay equivalent below it
  function sectionName(s, tag) {
    const L = document.createElement("span"); L.className = "L"; L.textContent = s; L.setAttribute("aria-hidden", "true");
    const en = document.createElement(tag); en.className = "en"; en.lang = "en"; en.textContent = T.en.sections[s][0];
    const parts = [L, en];
    if (state.lang === "ms") {
      const ms = document.createElement("span"); ms.className = "ms"; ms.lang = "ms"; ms.textContent = T.ms.sections[s][0];
      parts.push(ms);
    }
    return parts;
  }

  function renderForm() {
    const t = T[state.lang];
    const root = $("sections");
    root.replaceChildren();
    SECTIONS.forEach(s => {
      const sec = document.createElement("section");
      sec.className = "block"; sec.id = "sec-" + s;
      const head = document.createElement("div"); head.className = "block-head";
      const [L, h2, ms] = sectionName(s, "h2");
      L.className = "mark";
      const hw = document.createElement("div");
      const p = document.createElement("p"); p.textContent = t.sections[s][1];
      hw.append(...[h2, ms, p].filter(Boolean)); head.append(L, hw); sec.append(head);

      FIELDS.filter(f => f.s === s).forEach(f => sec.append(renderField(f, t)));
      root.append(sec);
    });
  }

  function renderField(f, t) {
    const meta = t.fields[f.id];
    const wrap = document.createElement("div"); wrap.className = "field";
    const inputId = "f-" + f.id, helpId = "h-" + f.id;

    if (f.type === "checkbox") {
      const row = document.createElement("div"); row.className = "check";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = inputId;
      cb.checked = !!state[f.id]; cb.setAttribute("aria-describedby", helpId);
      cb.addEventListener("change", () => {
        state[f.id] = cb.checked;
        document.querySelectorAll(`[data-depends="${f.id}"]`).forEach(e => { e.disabled = !cb.checked; });
        update();
      });
      const lw = document.createElement("div");
      const lab = document.createElement("label"); lab.htmlFor = inputId; lab.textContent = meta.label;
      const help = document.createElement("p"); help.className = "help"; help.id = helpId; help.textContent = meta.help;
      lw.append(lab, help); row.append(cb, lw); wrap.append(row);
      return wrap;
    }

    const top = document.createElement("div"); top.className = "field-top";
    const lab = document.createElement("label"); lab.htmlFor = inputId; lab.textContent = meta.label;
    if (f.optional) { const o = document.createElement("span"); o.className = "opt"; o.textContent = "(" + t.optional + ")"; lab.append(o); }
    top.append(lab);

    let exampleValue = null;
    if (f.type === "select") exampleValue = f.id === "outputLang" ? state.lang : f.example;
    else if (meta.ex) exampleValue = meta.ex;

    let el;
    if (f.type === "select") {
      el = document.createElement("select");
      f.options.forEach(opt => {
        const o = document.createElement("option"); o.value = opt; o.textContent = t.options[f.id][opt];
        el.append(o);
      });
      el.value = f.id === "outputLang" ? outLang() : (state[f.id] ?? f.options[0]);
      el.addEventListener("change", () => { state[f.id] = el.value; update(); });
    } else {
      el = document.createElement(f.type === "textarea" ? "textarea" : "input");
      if (f.type === "text") el.type = "text";
      if (f.rows) el.rows = f.rows;
      el.value = state[f.id] || "";
      if (meta.ex) el.placeholder = t.egPrefix + meta.ex;
      el.addEventListener("input", () => { state[f.id] = el.value; update(); });
    }
    el.id = inputId; el.setAttribute("aria-describedby", helpId);
    if (f.dependsOn) { el.dataset.depends = f.dependsOn; el.disabled = !state[f.dependsOn]; }

    if (exampleValue !== null) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ex-btn"; b.textContent = t.useExample;
      if (f.dependsOn) { b.dataset.depends = f.dependsOn; b.disabled = !state[f.dependsOn]; }
      b.setAttribute("aria-label", t.useExample + ": " + meta.label);
      b.addEventListener("click", () => {
        state[f.id] = exampleValue; el.value = exampleValue; update(); el.focus();
      });
      top.append(b);
    }

    const help = document.createElement("p"); help.className = "help"; help.id = helpId; help.textContent = meta.help;
    wrap.append(top, help, el);
    return wrap;
  }

  // Render the prompt, softly marking any [placeholder] still left in it
  function renderOutput(text) {
    const out = $("output");
    out.replaceChildren();
    text.split("\n").forEach((line, i) => {
      if (i) out.append("\n");
      const host = /^#{1,3} /.test(line) ? out.appendChild(Object.assign(document.createElement("span"), { className: "hd" })) : out;
      const re = /\[[^\]\n]+\]/g;
      let last = 0, m;
      while ((m = re.exec(line))) {
        if (m.index > last) host.append(line.slice(last, m.index));
        const span = document.createElement("span"); span.className = "ph"; span.textContent = m[0];
        host.append(span);
        last = m.index + m[0].length;
      }
      if (last < line.length) host.append(line.slice(last));
    });
  }

  function update() {
    const t = T[state.lang];
    const text = buildPrompt();
    renderOutput(text);
    const filled = TEXT_FIELDS.filter(f => val(f.id)).length;
    $("progress").textContent = t.progress(filled, TEXT_FIELDS.length);
    SECTIONS.forEach(s => {
      const dots = $("dots-" + s);
      if (!dots) return;
      const fs = TEXT_FIELDS.filter(f => f.s === s);
      const n = fs.filter(f => val(f.id)).length;
      dots.replaceChildren(...fs.map(f => {
        const d = document.createElement("span"); d.className = "dot" + (val(f.id) ? " on" : ""); return d;
      }));
      dots.setAttribute("role", "img");
      dots.setAttribute("aria-label", t.sectionProgress(n, fs.length));
    });
    const words = text.split(/\s+/).filter(Boolean).length;
    $("stats").textContent = t.stats(words, text.length);
    save();
  }

  function renderAll() { renderStatic(); renderForm(); update(); }

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const el = $("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* ---------- Actions ---------- */
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    if (state.lang === b.dataset.lang) return;
    state.lang = b.dataset.lang;
    renderAll();
  }));

  $("fillAll").addEventListener("click", () => {
    const t = T[state.lang];
    FIELDS.forEach(f => {
      if (f.type === "checkbox") state[f.id] = true;
      else if (f.type === "select") state[f.id] = f.id === "outputLang" ? state.lang : f.example;
      else if (t.fields[f.id].ex) state[f.id] = t.fields[f.id].ex;
    });
    renderForm(); update(); toast(t.filled);
  });

  $("clearAll").addEventListener("click", () => {
    const t = T[state.lang];
    if (!window.confirm(t.confirmClear)) return;
    const lang = state.lang;
    state = blankState(); state.lang = lang;
    renderForm(); update(); toast(t.cleared);
  });

  $("copyBtn").addEventListener("click", async () => {
    const t = T[state.lang];
    const text = buildPrompt();
    try {
      await navigator.clipboard.writeText(text);
      toast(t.copied);
    } catch (e) {
      // Fallback for browsers without the async clipboard API
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      ta.remove();
      toast(ok ? t.copied : t.copyFail);
    }
  });

  $("dlBtn").addEventListener("click", () => {
    const t = T[state.lang];
    const slug = (val("ministry") || "ministry").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "ministry";
    const blob = new Blob([buildPrompt()], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `craft-prompt-${slug}-${state.lang}.md`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(t.downloaded);
  });

  $("printBtn").addEventListener("click", () => window.print());

  renderAll();
})();
</script>
</body>
